services:
  pii-remover:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - USE_GPU=false
    image: pii-remover:latest
    container_name: pii-remover
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    # The hf_cache volume persists model weights (~500MB) across container restarts.
    # This prevents redownloading the model every time the container is recreated.
    volumes:
      - hf_cache:/home/appuser/.cache
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
    restart: unless-stopped

# Named volumes are persisted even if the container is deleted.
# Use 'docker compose down -v' to wipe the cache if needed.
volumes:
  hf_cache:
    driver: local
